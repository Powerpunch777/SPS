name: Product suggestion
description: Suggest a user-facing SPS improvement.
title: "[Idea]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult today, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result rather than prescribing an implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Desktop and onboarding
        - Host and Member collaboration
        - Agents and runtimes
        - Workspace Sources
        - Plugins and discovery
        - Data, backup, and recovery
        - Other
    validations:
      required: true
